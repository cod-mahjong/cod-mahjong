<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="380" viewBox="0 0 480 380">
  <!-- 시상대 배경 패턴: 정육면체 하나의 세 면에 C(왼쪽) · O(윗면) · D(오른쪽) — make_pattern.py로 생성 -->
  <defs>
    <g id="cubeLines" fill="none" stroke-linejoin="miter">
      <polygon points="0.00,-74.00 64.09,-37.00 64.09,37.00 0.00,74.00 -64.09,37.00 -64.09,-37.00" />
      <polyline points="-64.09,-37.00 0.00,0.00 64.09,-37.00" />
      <line x1="0" y1="0" x2="0" y2="74" />
    </g>
    <g id="faceLetters" fill="none" stroke-linejoin="miter">
      <path transform="matrix(0.6409 0.3700 0.0000 0.7400 -64.09 -37.00)" d="M80 22 H22 V78 H80" />
      <path transform="matrix(0.6409 -0.3700 0.6409 0.3700 -64.09 -37.00)" d="M22 22 H78 V78 H22 Z" />
      <path transform="matrix(0.6409 -0.3700 0.0000 0.7400 0.00 0.00)" d="M22 22 H58 L78 42 V58 L58 78 H22 Z" />
    </g>
    <g id="cube">
      <use href="#cubeLines" xlink:href="#cubeLines" stroke="#ffffff" stroke-width="22" />
      <use href="#cubeLines" xlink:href="#cubeLines" stroke="#ececec" stroke-width="10" />
      <use href="#faceLetters" xlink:href="#faceLetters" stroke="#ffffff" stroke-width="24" />
      <use href="#faceLetters" xlink:href="#faceLetters" stroke="#ececec" stroke-width="10" />
    </g>
  </defs>
  <rect width="480" height="380" fill="#ececec" />
  <use href="#cube" xlink:href="#cube" x="120" y="95" />
  <use href="#cube" xlink:href="#cube" x="360" y="95" />
